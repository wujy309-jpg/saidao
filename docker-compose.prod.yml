version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: saidao-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/app/data
      - backend-logs:/app/logs
    restart: always
    networks:
      - saidao-network

volumes:
  backend-uploads:
  backend-data:
  backend-logs:

networks:
  saidao-network:
    driver: bridge
