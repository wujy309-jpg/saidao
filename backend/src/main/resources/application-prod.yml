server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: saidao-backend
  
  datasource:
    # 默认 H2 文件库；设置 DB_URL/DB_DRIVER/DB_USERNAME/DB_PASSWORD/DB_PLATFORM 环境变量即可切换 MySQL
    url: ${DB_URL:jdbc:h2:file:/app/data/saidaodb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  
  h2:
    console:
      enabled: false
  
  jpa:
    database-platform: ${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  
  sql:
    init:
      mode: never

file:
  upload-dir: /app/uploads

jwt:
  secret: ${JWT_SECRET:TrainingSystemSecretKey2024VeryLongSecretForHS256AlgorithmMustBeAtLeast256Bits}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

ai:
  code-analysis:
    enabled: true
    max-lines: 10000
  document-analysis:
    enabled: true
    max-size: 10MB

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  max-tokens: 2048
  temperature: 0.7
  enabled: true

logging:
  level:
    com.saidao.backend: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

# 生产环境关闭 Swagger 文档接口（避免对外暴露 API 文档）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
