server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: training-backend
  
  datasource:
    url: jdbc:h2:mem:trainingdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
   
  h2:
    console:
      enabled: true
      path: /h2-console
   
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
  
  sql:
    init:
      mode: never
   
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  
  cache:
    type: simple

file:
  upload-dir: ./uploads

jwt:
  secret: ${JWT_SECRET:TrainingSystemSecretKey2024VeryLongSecretForHS256AlgorithmMustBeAtLeast256Bits}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

security:
  login:
    max-attempts: 5
    lock-duration-minutes: 30
    attempt-window-minutes: 15

ai:
  code-analysis:
    enabled: true
    max-lines: 10000
  document-analysis:
    enabled: true
    max-size: 10MB

deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-your-deepseek-api-key-here
  base-url: https://api.deepseek.com
  model: deepseek-chat
  max-tokens: 2048
  temperature: 0.7
  enabled: true

logging:
  level:
    com.training.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.stat: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
