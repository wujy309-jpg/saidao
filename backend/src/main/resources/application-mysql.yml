server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: saidao-backend
  
  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/training_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
   
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
   
  # File upload configuration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# File storage path
file:
  upload-dir: ./uploads

# JWT configuration
jwt:
  secret: TrainingSystemSecretKey2024VeryLongSecretForHS256AlgorithmMustBeAtLeast256Bits
  expiration: 86400000  # 24 hours

# AI review configuration
ai:
  code-analysis:
    enabled: true
    max-lines: 10000
  document-analysis:
    enabled: true
    max-size: 10MB

# Logging configuration
logging:
  level:
    com.saidao.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
